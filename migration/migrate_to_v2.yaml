---
# migration/migrate_to_v2.yaml
#
# Migrates a pre-v2 all.yaml (schema_version absent or < 2) to the v2 format.
#
# What changed between v1 and v2
# --------------------------------
# v1:  The bastion was defined as a single block at env.bastion inside all.yaml.
# v2:  The bastion configuration was moved to a per-bastion host_vars file
#      (inventories/default/host_vars/<name>.yaml).
#      all.yaml now contains a 'bastion_nodes' list of host_vars file names
#      instead of the full env.bastion block.
#      schema_version: 2 was added to all.yaml.
#
# What this playbook does
# -------------------------
#  1. Reads the existing all.yaml.
#  2. Aborts if schema_version is already 2 (nothing to do).
#  3. Extracts env.bastion into a new host_vars file:
#       inventories/default/host_vars/<bastion_vm_name>.yaml
#     The host_vars file uses the KVM bastion template layout (type: kvm).
#  4. Adds 'bastion_nodes: [<bastion_vm_name>]' to all.yaml.
#  5. Removes env.bastion from all.yaml.
#  6. Adds 'schema_version: 2' to all.yaml.
#  7. Writes a backup of the original all.yaml alongside the migrated file.
#
# Usage
# -----
#   ansible-playbook migration/migrate_to_v2.yaml \
#     -e "inventory_dir=inventories/default"
#
# The variable 'inventory_dir' defaults to 'inventories/default'.
# Run from the repository root.

- name: Migrate all.yaml from v1 to v2
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    inventory_dir: "inventories/default"
    all_yaml_path: "{{ inventory_dir }}/group_vars/all.yaml"
    host_vars_dir: "{{ inventory_dir }}/host_vars"

  tasks:

    # ── 1. Read current all.yaml ───────────────────────────────────────────
    - name: Read current all.yaml
      ansible.builtin.slurp:
        src: "{{ all_yaml_path }}"
      register: _all_raw

    - name: Parse all.yaml content
      ansible.builtin.set_fact:
        _all: "{{ _all_raw.content | b64decode | from_yaml }}"

    # ── 2. Abort if already v2 ─────────────────────────────────────────────
    - name: Abort if already at schema_version 2
      ansible.builtin.fail:
        msg: >
          {{ all_yaml_path }} already has schema_version: {{ _all.schema_version }}.
          Nothing to migrate.
      when: (_all.schema_version | default(1) | int) >= 2

    # ── 3. Validate that env.bastion exists ────────────────────────────────
    - name: Fail if env.bastion is not present in all.yaml
      ansible.builtin.fail:
        msg: >
          No env.bastion block found in {{ all_yaml_path }}.
          This file may already be partially migrated or use an unexpected layout.
      when: _all.env.bastion is not defined

    - name: Set bastion facts from env.bastion
      ansible.builtin.set_fact:
        _bastion: "{{ _all.env.bastion }}"
        _bastion_name: "{{ _all.env.bastion.vm_name }}"

    # ── 4. Write backup ────────────────────────────────────────────────────
    - name: "Write backup: {{ all_yaml_path }}.v1.bak"
      ansible.builtin.copy:
        src: "{{ all_yaml_path }}"
        dest: "{{ all_yaml_path }}.v1.bak"
        mode: "0600"

    - name: Backup written
      ansible.builtin.debug:
        msg: "Backup saved to {{ all_yaml_path }}.v1.bak"

    # ── 5. Build the new host_vars file content ────────────────────────────
    - name: Set host_vars file path
      ansible.builtin.set_fact:
        _hv_path: "{{ host_vars_dir }}/{{ _bastion_name }}.yaml"

    - name: Fail if host_vars file already exists
      ansible.builtin.stat:
        path: "{{ _hv_path }}"
      register: _hv_stat

    - name: Abort if host_vars file already exists
      ansible.builtin.fail:
        msg: >
          {{ _hv_path }} already exists. Remove it manually before running this migration,
          or it will be overwritten. Aborting to be safe.
      when: _hv_stat.stat.exists

    - name: "Write host_vars file: {{ _hv_path }}"
      ansible.builtin.copy:
        dest: "{{ _hv_path }}"
        mode: "0600"
        content: |
          # Bastion node host_vars — migrated from env.bastion in all.yaml (v1 → v2)
          # Generated by migration/migrate_to_v2.yaml
          #
          # Ansible connection variables
          ansible_become_password: "{{ '{{' }} vault_bastion_pass {{ '}}' }}"
          ansible_password: "{{ '{{' }} vault_bastion_pass {{ '}}' }}"

          bastion:
            type: kvm
            create: {{ _bastion.create | default(true) | lower }}

            hypervisor_host: {{ _all.env.z.lpar1.hostname | default('#X  # fill in: KVM host hostname') }}

            vm_name: {{ _bastion_name }}
            resources:
              disk_size: {{ _bastion.resources.disk_size | default(80) }}
              ram: {{ _bastion.resources.ram | default(4096) }}
              swap: {{ _bastion.resources.swap | default(4096) }}
              vcpu: {{ _bastion.resources.vcpu | default(4) }}
              vcpu_model_option: "{{ _bastion.resources.vcpu_model_option | default('--cpu host') }}"

            networking:
              ip: {{ _bastion.networking.ip | default('#X') }}
              internal_ip: {{ _bastion.networking.internal_ip | default('') }}
              ipv6: {{ _bastion.networking.ipv6 | default('') }}
              mac: {{ _bastion.networking.mac | default('') }}
              hostname: {{ _bastion.networking.hostname | default('#X') }}
              base_domain: {{ _bastion.networking.base_domain | default('#X') }}
              subnetmask: {{ _bastion.networking.subnetmask | default('#X') }}
              gateway: {{ _bastion.networking.gateway | default('#X') }}
              ipv6_gateway: {{ _bastion.networking.ipv6_gateway | default('') }}
              ipv6_prefix: {{ _bastion.networking.ipv6_prefix | default('') }}
              nameserver1: {{ _bastion.networking.nameserver1 | default('#X') }}
          {% if _bastion.networking.nameserver2 is defined %}
              nameserver2: {{ _bastion.networking.nameserver2 }}
          {% endif %}
              forwarder: {{ _bastion.networking.forwarder | default('1.1.1.1') }}
              interface: {{ _bastion.networking.interface | default('#X') }}

            access:
              user: {{ _bastion.access.user | default('#X') }}
              pass: "{{ '{{' }} vault_bastion_pass {{ '}}' }}"
              root_pass: "{{ '{{' }} vault_bastion_root_pass {{ '}}' }}"

            options:
              dns: {{ _bastion.options.dns | default(true) | lower }}
              loadbalancer:
                on_bastion: {{ _bastion.options.loadbalancer.on_bastion | default(true) | lower }}
          {% if _bastion.options.loadbalancer.public_ip is defined %}
                public_ip: {{ _bastion.options.loadbalancer.public_ip }}
          {% endif %}
          {% if _bastion.options.loadbalancer.private_ip is defined %}
                private_ip: {{ _bastion.options.loadbalancer.private_ip }}
          {% endif %}

    # ── 6. Rewrite all.yaml: add schema_version + bastion_nodes, remove env.bastion ──
    - name: Read all.yaml as raw text for line-level editing
      ansible.builtin.slurp:
        src: "{{ all_yaml_path }}"
      register: _all_text_raw

    - name: Decode all.yaml text
      ansible.builtin.set_fact:
        _all_text: "{{ _all_text_raw.content | b64decode }}"

    - name: Remove env.bastion block and add schema_version + bastion_nodes
      ansible.builtin.copy:
        dest: "{{ all_yaml_path }}"
        mode: "0600"
        # Use regex_replace to strip the env.bastion block (from '# Section 5 - Bastion'
        # or '  bastion:' through the blank line before '# Section 6').
        # Then prepend schema_version and inject bastion_nodes after the header.
        content: >-
          {{ _all_text
             | regex_replace('(?m)^# Section 5 - Bastion\n  bastion:.*?(?=\n# Section 6)', '')
             | regex_replace('(?m)^  bastion:.*?(?=\n# Section 6)', '')
             | regex_replace('(?m)^(# Section 1 - Ansible Controller\n)',
                             'schema_version: 2\n\nbastion_nodes:\n  - ' + _bastion_name + '\n\n\1')
          }}

    - name: Migration complete
      ansible.builtin.debug:
        msg: |
          ✓ Migration complete.

          Created : {{ _hv_path }}
          Modified: {{ all_yaml_path }}
          Backup  : {{ all_yaml_path }}.v1.bak

          Next steps:
            1. Review {{ _hv_path }} and verify all values are correct.
            2. Add '{{ _bastion_name }}' to your inventory hosts file under [bastion].
            3. Run: ansible-vault encrypt {{ inventory_dir }}/group_vars/secrets.yaml
               (if not already encrypted)
            4. Re-run the playbooks from 0_setup.yaml.
