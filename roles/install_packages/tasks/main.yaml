---
- name: Print the list of packages to be installed and updated
  tags: install_packages
  ansible.builtin.debug:
    msg: "{{ vars[packages] }}"

- name: Getting OS Version
  ansible.builtin.shell:
    cmd: cat /etc/*release | grep 'VERSION_ID' | cut -d "=" -f 2 | tr -d '"'
  register: os_version
  changed_when: false

- name: Installing libvirt-devel packages for RHEL machines.
  tags: install_packages
  become: true
  ansible.builtin.package:
    name: "libvirt-devel"
    state: latest
    update_cache: true
  when: ( ansible_os_family | lower == 'redhat') and ( os_version.stdout| float < 9.0 )

- name: Installing required packages for Linux machines.
  tags: install_packages
  become: true
  ansible.builtin.package:
    name: "{{ item }}"
    state: latest
    update_cache: true
  loop: "{{ vars[packages] }}"
  when: ansible_os_family != 'Darwin'
  ignore_errors: true
  register: pkg_install_result

- name: Warn if any packages failed to install (e.g. stale repo metadata).
  tags: install_packages
  ansible.builtin.debug:
    msg: >-
      WARNING: package '{{ item.item }}' could not be installed on
      {{ inventory_hostname }} — {{ item.msg | default('unknown error') }}.
      This may be caused by an outdated or unreachable yum repository
      (e.g. repomd.xml download failure). The setup will continue but
      some functionality may be missing until the repo issue is resolved.
  loop: "{{ pkg_install_result.results }}"
  when:
    - ansible_os_family != 'Darwin'
    - item.failed | default(false)

- name: Installing required packages for Mac machines.
  tags: install_packages
  become: false
  community.general.homebrew:
    name: "{{ item }}"
    state: latest
  loop: "{{ vars[packages] }}"
  when: ansible_os_family == 'Darwin'
