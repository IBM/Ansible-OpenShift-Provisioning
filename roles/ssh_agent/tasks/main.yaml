---
- name: Ensure ~/.bash_profile exists
  ansible.builtin.file:
    path: ~/.bash_profile
    state: touch
    mode: '0644'
  become: false

- name: Decide which SSH key Ansible has to use
  tags: always
  ansible.builtin.include_role:
    name: ssh_key_gen
    tasks_from: resolve_key

- name: Add ansible SSH key to ssh-agent
  tags: ssh_agent, ssh
  ansible.builtin.lineinfile:
    line: "eval $(ssh-agent) && ssh-add {{ ssh_private_key_path }}"
    path: ~/.bash_profile
  become: false
  register: ssh_agent_setup

- name: Print results from setting up SSH agent
  tags: ssh_agent, ssh
  ansible.builtin.debug:
    var: ssh_agent_setup
  become: false
