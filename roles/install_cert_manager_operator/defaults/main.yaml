---
# Default values for the cert-manager Operator for Red Hat OpenShift installation.

cert_manager_namespace: cert-manager-operator
cert_manager_channel: stable-v1
cert_manager_catalog_source: redhat-operators
cert_manager_csv_timeout: 300   # Seconds to wait for the cert-manager CSV to reach Succeeded
cert_manager_pod_timeout: 120   # Seconds to wait for cert-manager pods to become Running
