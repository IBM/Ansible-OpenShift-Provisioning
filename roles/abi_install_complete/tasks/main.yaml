---
- name: wait-for install-complete
  when: not install_config_vars.fips
  block:
    - name: Start openshift-installer with 'wait-for install-complete' (async task)
      ansible.builtin.command: openshift-install agent wait-for install-complete --dir=.
      args:
        chdir: "{{ ocpinst_dir }}"
      # Maximum runtime of the installer in seconds (abi.install_timeout)
      async: "{{ abi.install_timeout | default(7200) | int }}"
      poll: 0
      register: watch_install_complete

    - name: "Retry wait-for install-complete job ID check until it's finished. This may take some time... To watch progress"
      ansible.builtin.async_status:
        jid: "{{ watch_install_complete.ansible_job_id }}"
      register: install_complete
      until: install_complete.finished
      # Total wait time is abi.install_timeout, polled every abi.install_poll_delay seconds
      retries: "{{ ((abi.install_timeout | default(7200) | int) / (abi.install_poll_delay | default(30) | int)) | round(0, 'ceil') | int }}"
      delay: "{{ abi.install_poll_delay | default(30) | int }}"

- name: FIPS wait-for install-complete
  when: install_config_vars.fips
  block:
    - name: Start openshift-installer with 'wait-for install-complete' (async task)
      ansible.builtin.command: openshift-install-fips agent wait-for install-complete --dir=.
      args:
        chdir: "{{ ocpinst_dir }}"
      # Maximum runtime of the installer in seconds (abi.install_timeout)
      async: "{{ abi.install_timeout | default(7200) | int }}"
      poll: 0
      register: watch_install_complete

    - name: "Retry wait-for install-complete job ID check until it's finished. This may take some time... To watch progress"
      ansible.builtin.async_status:
        jid: "{{ watch_install_complete.ansible_job_id }}"
      register: install_complete
      until: install_complete.finished
      # Total wait time is abi.install_timeout, polled every abi.install_poll_delay seconds
      retries: "{{ ((abi.install_timeout | default(7200) | int) / (abi.install_poll_delay | default(30) | int)) | round(0, 'ceil') | int }}"
      delay: "{{ abi.install_poll_delay | default(30) | int }}"

- name: Create ~/.kube directory if it does not exist
  tags: kubeconfig
  ansible.builtin.file:
    path: ~/.kube
    state: directory
    mode: '0755'

- name: Copy kubeconfig to ~/.kube/config
  tags: kubeconfig
  ansible.builtin.copy:
    src: "{{ ocpinst_dir }}/auth/kubeconfig"
    dest: ~/.kube/config
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
    remote_src: true

- name: Check if kubeconfig was copied
  tags: kubeconfig
  ansible.builtin.stat:
    path: ~/.kube/config
  register: kubeconfig_status

- name: Display kubeconfig message
  tags: kubeconfig
  ansible.builtin.debug:
    msg: "Kubeconfig is set at ~/.kube/config. No need to export KUBECONFIG unless you want to use a different one."
  when: kubeconfig_status.stat.exists

- name: Display cluster details post-install
  ansible.builtin.debug:
    msg:
      - Installation completed!
      - >-
        Access the OpenShift web-console here -->
        https://console-openshift-console.apps.{{ env.cluster.networking.metadata_name }}.{{ env.cluster.networking.base_domain }}
      - kubeadmin password of cluster is stored in {{ ocpinst_dir }}/auth/kubeadmin-password on bastion.
      - >-
        Login command -->
        oc login https://api.{{ env.cluster.networking.metadata_name }}.{{ env.cluster.networking.base_domain }}:6443
        -u kubeadmin -p $( cat {{ ocpinst_dir }}/auth/kubeadmin-password )
