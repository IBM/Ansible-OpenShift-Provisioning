# Openshift Settings
install_config_defaults:
  api_version: v1
  compute:
    architecture: s390x
    hyperthreading: Enabled
  control:
    architecture: s390x
    hyperthreading: Enabled
  cluster_network:
    cidr: 10.128.0.0/14
    host_prefix: 23
    type: OVNKubernetes
  service_network: 172.30.0.0/16
  machine_network: 192.168.122.0/24
  fips: false

# Fallback directory URL, used only if neither 'ocp_download_url' nor the deprecated
# abi.ocp_installer_* variables are set. It is intentionally NOT named 'ocp_download_url',
# so that 'ocp_download_url is defined' means "the user set it".
_ocp_download_url_default: "https://mirror.openshift.com/pub/openshift-v4/multi/clients/ocp/latest/s390x/"
# ocp client and installer filenames
ocp_client_tgz: "openshift-client-linux.tar.gz"
ocp_install_tgz: "openshift-install-linux.tar.gz"
ocp_install_fips_tgz: "openshift-install-rhel9"
