---
###################################################################################################
# To execute this playbook, define [`day2_compute_node`](inventories/default/group_vars/all.yaml:235)
# as a list containing one host_vars entry name.
#
# Example:
# day2_compute_node:
#   - new_compute_node
#
# The node definition is loaded from
# [`inventories/default/host_vars/new_compute_node.yaml`](inventories/default/host_vars/new_compute_node.yaml)
# using the template structure from
# [`inventories/default/host_vars/compute-day2.yaml.template`](inventories/default/host_vars/compute-day2.yaml.template)
###################################################################################################

- name: Add an additional compute node
  # Select bastion host
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  pre_tasks:
    - name: Check required variables
      when: (day2_compute_node is not defined) or (day2_compute_node | length == 0)
      block:
        - name: Check required variables
          ansible.builtin.debug:
            msg:
              - "ERROR: Variable 'day2_compute_node' is not defined or empty!"
              - "Set [`day2_compute_node`](inventories/default/group_vars/all.yaml:235) to a list with one host_vars entry name."
        - name: Abort playbook
          ansible.builtin.fail:
            msg: "See above error!"

    - name: Load day-2 compute node host_vars
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/host_vars/{{ day2_compute_node[0] }}.yaml"
        name: day2_compute_node_vars

    - name: Get RHCOS iso download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_compute_node_vars.hypervisor_arch }}.artifacts.metal.formats.iso.disk.location'
      register: _rhcos_iso_dl_url

    - name: Check variable '_rhcos_iso_dl_url' is not 'null'
      ansible.builtin.fail:
        msg: "Failed to get RHCOS ISO URL for architecture {{ day2_compute_node_vars.hypervisor_arch }}"
      when: _rhcos_iso_dl_url.stdout == "null"

    - name: Get RHCOS kernel download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_compute_node_vars.hypervisor_arch }}.artifacts.metal.formats.pxe.kernel.location'
      register: _rhcos_kernel_dl_url

    - name: Get RHCOS initrd download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_compute_node_vars.hypervisor_arch }}.artifacts.metal.formats.pxe.initramfs.location'
      register: _rhcos_initrd_dl_url

    - name: Get RHCOS rootfs download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_compute_node_vars.hypervisor_arch }}.artifacts.metal.formats.pxe.rootfs.location'
      register: _rhcos_rootfs_dl_url

    - name: Redefine RHCOS variables
      ansible.builtin.set_fact:
        rhcos_live_kernel: "{{ (_rhcos_kernel_dl_url.stdout | split('/') | last) }}"
        rhcos_live_initrd: "{{ (_rhcos_initrd_dl_url.stdout | split('/') | last) }}"
        rhcos_live_rootfs: "{{ (_rhcos_rootfs_dl_url.stdout | split('/') | last) }}"
        rhcos_live_iso: "{{ (_rhcos_iso_dl_url.stdout.split('/')[-1]) }}"

    - name: Redefine RHCOS download url
      ansible.builtin.set_fact:
        # Assume all images have same download location
        rhcos_download_url: "{{ (_rhcos_rootfs_dl_url.stdout | replace(rhcos_live_rootfs, '')) }}"

  roles:
    - role: common
    - role: delete_compute_node
      # Some tasks will be delegated to the bastion host and target KVM host
      param_compute_node: "{{ day2_compute_node_vars }}"
    - role: print_node_status
    - role: update_ignition_files

    - role: dns_update
      when: env.bastion.options.dns is defined and env.bastion.options.dns
      param_dns_cmd: add
      param_dns_hostname: "{{ day2_compute_node_vars.node_vm_hostname }}"
      param_dns_ip: "{{ day2_compute_node_vars.networking.ip }}"

    - role: create_compute_node
      when: day2_compute_node_vars.hypervisor_name is defined
      # Some tasks will be delegated to the bastion host and target KVM host
      param_compute_node: "{{ day2_compute_node_vars }}"

    - role: approve_certs
    - role: wait_for_node
      wait_for_node_name: "{{ day2_compute_node_vars.node_vm_hostname }}"
    - role: approve_certs
      approve_certs_cleanup: true
    - role: print_node_status

    - role: haproxy_update
      when: env.bastion.options.loadbalancer.on_bastion
      param_haproxy_cmd: add
      param_haproxy_hostname: "{{ day2_compute_node_vars.node_vm_hostname }}"
