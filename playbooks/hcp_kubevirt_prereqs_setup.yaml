---
# Dynamically Add Bastion Host
- name: Add Bastion Host to Inventory
  hosts: localhost
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/secrets.yaml"
    - "{{ playbook_dir }}/../inventories/default/group_vars/hcp-kubevirt.yaml"
  tasks:
    - name: Add bastion dynamically
      ansible.builtin.add_host:
        name: "{{ hcp.mgmt_cluster_bastion.ip }}"
        groups: mgmt_bastion
        ansible_user: root
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/' + (hcp.ansible_key_name | default('ansible-ocpz', true)) }}"
        ansible_connection: ssh
        inventory_dir: "{{ playbook_dir }}/../inventories/default"

# Login to OCP Management Cluster (from bastion)
- name: Login to OCP Management Cluster
  hosts: mgmt_bastion
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/secrets.yaml"
    - "{{ playbook_dir }}/../inventories/default/group_vars/hcp-kubevirt.yaml"
  vars:
    vault_api_server: "{{ hcp.oc_url }}"
    vault_user_name: "{{ vault_ocp_user }}"
    vault_password: "{{ vault_ocp_password }}"
  roles:
    - login_to_mgmt_cluster

# Check Node Resources
- name: Check OCP Node Resource Usage
  hosts: mgmt_bastion
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/secrets.yaml"
    - "{{ playbook_dir }}/../inventories/default/group_vars/hcp-kubevirt.yaml"
  vars:
    resource_threshold: 75
    debug_mode: true
  roles:
    - check_node_resources

# Install Operators on Mgmt Cluster Bastion
- name: Install Operators on the management cluster
  hosts: mgmt_bastion
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/secrets.yaml"
    - "{{ playbook_dir }}/../inventories/default/group_vars/hcp-kubevirt.yaml"
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load disconnected vars if file exists
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/default/group_vars/disconnected.yaml"
      failed_when: false

    - name: Ensure ansible work directory exists
      ansible.builtin.file:
        path: /root/ansible_workdir
        state: directory
        mode: '0755'

    - name: Ensure root kube directory exists
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Resolve mirroring user home directory on the mirror host
      ansible.builtin.shell: |
        set -o pipefail
        getent passwd {{ disconnected.mirroring.host.user }} | awk -F: '{ print $6 }'
      changed_when: false
      register: mirror_user_home
      delegate_to: "{{ disconnected.mirroring.host.ip }}"
      vars:
        ansible_user: "{{ disconnected.mirroring.host.user }}"
        ansible_ssh_pass: "{{ disconnected.mirroring.host.pass | default(omit) }}"
      when: disconnected.enabled | default(false)

    - name: Resolve cluster-resources directory path
      ansible.builtin.set_fact:
        oc_mirror_cluster_resources_dir: >-
          {%- if disconnected.mirroring.cluster_resources_dir | default('', true) | length > 0 -%}
            {{ disconnected.mirroring.cluster_resources_dir }}
          {%- else -%}
            {{ mirror_user_home.stdout | trim }}/ocpinst_disconnected/working-dir/cluster-resources
          {%- endif -%}
      when: disconnected.enabled | default(false)

    - name: Find CatalogSource file in oc-mirror cluster-resources directory
      ansible.builtin.find:
        paths: "{{ oc_mirror_cluster_resources_dir }}"
        patterns: "cs-*.yaml"
        recurse: false
      register: cs_file_find
      when: disconnected.enabled | default(false)

    - name: Read CatalogSource names from oc-mirror output
      ansible.builtin.shell: |
        set -o pipefail
        grep -m1 '^  name:' {{ item.path }} | awk '{print $2}'
      register: cs_names_raw
      changed_when: false
      loop: "{{ cs_file_find.files }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - disconnected.enabled | default(false)
        - cs_file_find.matched > 0

    # With several catalogs in the ImageSetConfiguration (e.g. redhat-operator-index plus an
    # MCE nightly catalog such as mce-dev-catalog), oc-mirror writes one cs-*.yaml per catalog.
    # The catalog whose name matches disconnected.mirroring.mce_catalogsource_match is used for
    # MCE; all other operators use the first remaining catalog. With a single catalog, it is used for all.
    - name: Set disconnected CatalogSource name facts
      ansible.builtin.set_fact:
        disconnected_catalogsource_names: >-
          {{
            cs_names_raw.results
            | map(attribute='stdout')
            | map('trim')
            | select
            | list
          }}
      when:
        - disconnected.enabled | default(false)
        - cs_names_raw.results is defined

    - name: Resolve CatalogSource names per operator
      ansible.builtin.set_fact:
        disconnected_catalogsource_name: >-
          {{
            (
              disconnected_catalogsource_names
              | reject('search', mce_match)
              | list
              | first
            ) | default(
              disconnected_catalogsource_names | first
            )
          }}
        disconnected_mce_catalogsource_name: >-
          {{
            (
              disconnected_catalogsource_names
              | select('search', mce_match)
              | list
              | first
            ) | default(
              disconnected_catalogsource_names
              | reject('search', mce_match)
              | list
              | first
            ) | default(
              disconnected_catalogsource_names | first
            )
          }}
      vars:
        mce_match: >-
          {{
            disconnected.mirroring.mce_catalogsource_match
            | default('mce-dev-catalog', true)
          }}
      when:
        - disconnected.enabled | default(false)
        - disconnected_catalogsource_names is defined
        - disconnected_catalogsource_names | length > 0

    - name: Display resolved CatalogSource names
      ansible.builtin.debug:
        msg: >-
          Using CatalogSource '{{ disconnected_catalogsource_name }}' for disconnected operator installs
          and '{{ disconnected_mce_catalogsource_name }}' for MCE
      when:
        - disconnected.enabled | default(false)
        - disconnected_catalogsource_name is defined

  roles:
    - install_mce_operator_kubevirt
    - install_metallb_operator
    - install_ocpvirt_operator
    - role: install_lso_operator
      when: hcp.storage.type == "odf"
    - role: install_odf_operator
      when: hcp.storage.type == "odf"
    - role: install_hpp
      when: hcp.storage.type == "hpp"
    - monitor_hcp_preq_installation
