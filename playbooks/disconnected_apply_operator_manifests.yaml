---
- name: Disconnected apply operator manifests
  hosts: bastion
  become: true
  environment:
    KUBECONFIG: "{{ '/home/' if (bastion.access.user != 'root') else '/' }}{{ bastion.access.user }}/.kube/config"
  gather_facts: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
    - "{{ inventory_dir }}/group_vars/disconnected.yaml"
  pre_tasks:
    - name: Merge bastion host_vars into env.bastion for backward compatibility
      ansible.builtin.include_tasks: ../roles/bastion_dispatch/tasks/set_bastion_env_compat.yaml
  tasks:
    - name: apply operator manifests when cluster is disconnected
      ansible.builtin.include_role:
        name: '{{ item }}'
      loop:
        - disconnected_check_vars
        - disconnected_apply_operator_manifests_to_cluster
      when: disconnected.enabled
