---

- name: "Setup inventory and install galaxy"
  hosts: localhost
  tags: localhost
  connection: local
  become: false
  gather_facts: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
    - "{{ inventory_dir }}/group_vars/disconnected.yaml"
    - "{{ inventory_dir }}/group_vars/zvm.yaml"
  roles:
    - set_inventory
    - install_galaxy

  pre_tasks:
    - name: Check disconnected variables if disconnected cluster will be installed.
      tags: disconnected
      ansible.builtin.include_role:
        name: disconnected_check_vars
      when: disconnected.enabled

  post_tasks:
    - name: Find ibm_zhmc collection install location, if automated LPAR creation is to be used.
      tags: galaxy
      ansible.builtin.shell: |
        set -o pipefail
        ansible-galaxy collection list ibm.ibm_zhmc | grep -i ansible | cut -c 3-
      register: zhmc_path
      when: env.z.lpar1.create or env.z.lpar2.create or env.z.lpar3.create

    - name: Ensure zhmcclient requirements are installed.
      tags: galaxy
      ansible.builtin.pip:
        requirements: "{{ zhmc_path.stdout }}/ibm/ibm_zhmc/requirements.txt"
        executable: pip3
        extra_args: --upgrade
      when: env.z.lpar1.create or env.z.lpar2.create or env.z.lpar3.create

    - name: Check to make sure that the KVM host has a corresponding inventory host_vars file named with matching hostname and .yaml extension.
      tags: lpar_check
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/host_vars/{{ env.z.lpar1.hostname }}.yaml"
      when: env.z.lpar1.hostname is defined
      register: lpar_host_vars
      failed_when: not lpar_host_vars.stat.exists

    - name: Check to make sure the second KVM hosts have a corresponding inventory host_vars file named with matching hostname and .yaml extension, if defined.
      tags: lpar_check
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/host_vars/{{ env.z.lpar2.hostname }}.yaml"
      when: env.z.lpar2.hostname is defined and env.z.lpar2.hostname is not none and env.z.lpar2.hostname | length > 0
      register: lpar_host_vars
      failed_when: not lpar_host_vars.stat.exists

    - name: Check to make sure the third KVM hosts have a corresponding inventory host_vars file named with matching hostname and .yaml extension, if defined.
      tags: lpar_check
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/host_vars/{{ env.z.lpar3.hostname }}.yaml"
      when: env.z.lpar3.hostname is defined and env.z.lpar3.hostname is not none and env.z.lpar3.hostname | length > 0
      register: lpar_host_vars
      failed_when: not lpar_host_vars.stat.exists

- name: "Install packages and cfg ssh"
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  vars:
    packages: "pkgs_controller"
    ssh_target: ["{{ env.file_server.ip }}", "{{ env.file_server.user }}", "{{ env.file_server.pass }}", "{{ path_to_key_pair }}"]
  roles:
    - install_packages
    - ssh_key_gen
    - ssh_agent
    - ssh_copy_id # to file server

# ── Install tessia-baselib on the Ansible controller when needed for zVM ──────
# tessia-baselib is used to provision and power-manage z/VM guests directly from
# the controller over the network.  This play ensures it is present before
# 4_create_bastion.yaml and power_bastion.yaml run.
#
# Triggered when:
#   - installation_type is 'zvm' or 'lpar', OR
#   - at least one entry in bastion_nodes has bastion.type == 'zvm'
- name: "Install tessia-baselib on controller for zVM bastion creation"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  tasks:
    # Load each bastion's host_vars and check its type.
    # We accumulate a boolean flag rather than trying complex filter chains.
    - name: "Initialise _has_zvm_bastion flag"
      ansible.builtin.set_fact:
        _has_zvm_bastion: false

    - name: "Load bastion host_vars and set _has_zvm_bastion if type == zvm"
      ansible.builtin.include_tasks: ../roles/bastion_dispatch/tasks/check_zvm_bastion.yaml
      loop: "{{ bastion_nodes | default([]) }}"
      loop_control:
        loop_var: _bn_item

    - name: Install tessia-baselib on controller
      ansible.builtin.include_role:
        name: install_tessia_baselib
      when: >
        installation_type | lower in ['zvm', 'lpar'] or
        _has_zvm_bastion | bool
