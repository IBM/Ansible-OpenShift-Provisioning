---

- name: Copy SSH key to access KVM host 1
  hosts: localhost
  tags: ssh, ssh_copy_id, section_1, kvm_host_1
  connection: local
  become: false
  gather_facts: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  vars:
    ssh_target: ["{{ env.z.lpar1.ip }}", "{{ env.z.lpar1.user }}", "{{ env.z.lpar1.pass }}", "{{ path_to_key_pair }}"]
  tasks:
    - name: Include vars for the KVM host.
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/host_vars/{{ env.z.lpar1.hostname }}.yaml"
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Copy SSH key to KVM host.
      ansible.builtin.import_role:
        name: ssh_copy_id
      when: installation_type | lower in ['kvm', 'lpar']

- name: Copy SSH key to access KVM host 2
  hosts: localhost
  tags: ssh, ssh_copy_id, section_1, kvm_host_2
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  vars:
    ssh_target: ["{{ env.z.lpar2.ip }}", "{{ env.z.lpar2.user }}", "{{ env.z.lpar2.pass }}", "{{ path_to_key_pair }}"]
  tasks:
    - name: Include vars for second KVM host.
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/host_vars/{{ env.z.lpar2.hostname }}.yaml"
      when:
        - env.z.lpar2.hostname is defined
        - env.z.lpar2.hostname is not none
        - (env.z.lpar2.hostname | string | trim | length) > 0
        - installation_type | lower in ['kvm', 'lpar']

    - name: copy SSH key to second KVM host, if cluster is to be highly available.
      tags: ssh_copy_id, ssh
      ansible.builtin.import_role:
        name: ssh_copy_id
      when:
        - env.z.lpar2.hostname is defined
        - env.z.lpar2.hostname is not none
        - (env.z.lpar2.hostname | string | trim | length) > 0
        - installation_type | lower in ['kvm', 'lpar']

- name: Copy SSH key to access KVM host 3
  hosts: localhost
  tags: ssh, ssh_copy_id, section_1, kvm_host_3
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  vars:
    ssh_target: ["{{ env.z.lpar3.ip }}", "{{ env.z.lpar3.user }}", "{{ env.z.lpar3.pass }}", "{{ path_to_key_pair }}"]
  tasks:
    - name: Include vars for third KVM host.
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/host_vars/{{ env.z.lpar3.hostname }}.yaml"
      when:
        - env.z.lpar3.hostname is defined
        - env.z.lpar3.hostname is not none
        - (env.z.lpar3.hostname | string | trim | length) > 0
        - installation_type | lower in ['kvm', 'lpar']

    - name: copy SSH key to third KVM host, if cluster is to be highly available.
      tags: ssh_copy_id, ssh
      ansible.builtin.import_role:
        name: ssh_copy_id
      when:
        - env.z.lpar3.hostname is defined
        - env.z.lpar3.hostname is not none
        - (env.z.lpar3.hostname | string | trim | length) > 0
        - installation_type | lower in ['kvm', 'lpar']

- name: Prepare KVM host(s)
  hosts: kvm_host
  tags: setup, section_2
  gather_facts: true
  become: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  vars:
    packages: "pkgs_kvm"
  roles:
    - role: attach_subscription
      when: env.redhat.manage_subscription and installation_type | lower in ['kvm', 'lpar']
    - role: install_packages
      when: installation_type | lower in ['kvm', 'lpar']
    - role: httpd
      when: installation_type | lower in ['kvm', 'lpar']
    - role: tigervnc
      when: installation_type | lower == 'kvm'
  post_tasks:
    - name: Start and enable firewalld
      tags: firewall-libvirt, libvirt
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      when: installation_type | lower in ['kvm']

    - name: Add ports to firewall
      tags: firewall-libvirt, libvirt
      ansible.posix.firewalld:
        port: 80/tcp
        permanent: true
        state: enabled
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Start and enable libvirt
      tags: firewall-libvirt, libvirt
      ansible.builtin.service:
        name: libvirtd
        enabled: true
        state: started
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Permit traffic in libvirt zone
      tags: firewall-libvirt, libvirt
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        zone: libvirt
        immediate: true
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Set libvirt management to libvirt group instead of root.
      tags: libvirt
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '#group = "root"'
        line: 'group = "libvirt"'
        backup: true
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Get user home directory
      tags: libvirt
      ansible.builtin.shell: |
        set -o pipefail
        getent passwd {{ ansible_user }} | awk -F: '{ print $6 }'
      changed_when: false
      register: user_home
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Check if .config/libvirt directory exists
      tags: libvirt
      ansible.builtin.stat:
        path: "{{ user_home.stdout }}/.config/libvirt"
      register: home_config_libvirt
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Create .config/libvirt directory
      tags: libvirt
      ansible.builtin.file:
        path: "{{ user_home.stdout }}/.config/libvirt"
        state: directory
        mode: '0755'
      when: installation_type | lower in ['kvm', 'lpar'] and not home_config_libvirt.stat.exists

    - name: Create file for user's custom libvirt configurations.
      tags: libvirt
      ansible.builtin.file:
        path: "{{ user_home.stdout }}/.config/libvirt/libvirt.conf"
        state: touch
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Set default uri connection to qemu:///system.
      tags: libvirt
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '#uri_default = "qemu:///system"'
        line: 'uri_default = "qemu:///system"'
        backup: true
      loop:
        - /etc/libvirt/qemu.conf
        - "{{ user_home.stdout }}/.config/libvirt/libvirt.conf"
        - /etc/libvirt/libvirt.conf
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Ensure KVM admin user is part of groups 'kvm', 'libvirt'.
      tags: groups, group, libvirt
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        append: true
        groups: kvm,libvirt
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Restart libvirt
      tags: firewall-libvirt, libvirt
      ansible.builtin.service:
        name: libvirtd
        enabled: true
        state: restarted
      when: installation_type | lower in ['kvm', 'lpar']

    - name: Enable cockpit console
      tags: cockpit
      ansible.builtin.systemd:
        name: cockpit.socket
        enabled: true
        state: started
      when: installation_type | lower in ['kvm', 'lpar']

- name: Copy SSH key to access day-2 KVM host(s)
  hosts: localhost
  tags: ssh, ssh_copy_id, section_1, day2_kvm_host
  connection: local
  become: false
  gather_facts: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  tasks:
    - name: Copy SSH key to day-2 KVM host
      ansible.builtin.include_role:
        name: ssh_copy_id
      vars:
        ssh_target: ["{{ hostvars[item].ansible_host | default(item) }}", "{{ hostvars[item].ansible_user }}", "{{ hostvars[item].ansible_become_password }}", "{{ path_to_key_pair }}"]
      loop: "{{ groups['day2_hosts'] | default([]) }}"

- name: Configure ip_forward in case of NAT
  hosts: kvm_host
  tags: cfg_ip_forward, section_2
  gather_facts: true
  become: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  tasks:
    - name: Configure ip_forward in case of network "NAT"
      tags: cfg_ip_forward
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "{{ env.z.ip_forward }}"
        sysctl_set: true
        state: present
        reload: true
      when: installation_type | lower in ['kvm', 'lpar'] and env.network_mode | upper == 'NAT'

- name: Prepare day-2 KVM host(s)
  hosts: day2_hosts
  tags: setup, section_2, day2_kvm_host
  gather_facts: true
  become: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  vars:
    packages: "pkgs_kvm"
  tasks:
    - name: Load host_vars for matching day-2 KVM host
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/host_vars/{{ item }}.yaml"
        name: day2_host_vars
      loop: "{{ day2_compute_node | default([]) }}"
      when:
        - hostvars[inventory_hostname].inventory_hostname == item
          or hostvars[inventory_hostname].inventory_hostname == (lookup('file', inventory_dir ~ '/host_vars/' ~ item ~ '.yaml', errors='ignore') | default(''))
      failed_when: false

    - name: Set fallback day-2 networking facts from matching host_vars
      ansible.builtin.set_fact:
        networking: "{{ day2_host_vars.networking }}"
        storage: "{{ day2_host_vars.storage }}"
      when:
        - networking is not defined
        - day2_host_vars is defined
        - day2_host_vars.networking is defined

    - name: Attach subscription on day-2 KVM host
      community.general.redhat_subscription:
        state: present
        username: "{{ env.redhat.username }}"
        password: "{{ env.redhat.password }}"
        auto_attach: true
      register: day2_registration
      retries: 2
      delay: 30
      until: day2_registration is not failed
      when:
        - env.redhat.manage_subscription
        - env.redhat.password is defined
        - env.redhat.username is defined

    - name: Activate RHEL account on day-2 KVM host
      ansible.builtin.command:
        argv:
          - rhc
          - connect
          - --activation-key
          - "{{ env.redhat.rhel_activation_key }}"
          - --organization
          - "{{ env.redhat.rhel_organization }}"
      when:
        - env.redhat.activation_key is defined
        - env.redhat.organization is defined

    - name: Install rhc-worker-playbook on day-2 KVM host
      ansible.builtin.raw: dnf install -y rhc-worker-playbook
      changed_when: false

    - name: Install required packages on day-2 KVM host
      ansible.builtin.import_role:
        name: install_packages

    - name: Change permissive domain for httpd on day-2 KVM host
      community.general.selinux_permissive:
        name: httpd_t
        permissive: true

    - name: Allow httpd to listen on tcp port 4443 on day-2 KVM host
      tags: httpd
      community.general.seport:
        ports: 4443
        proto: tcp
        setype: http_port_t
        state: present
        reload: true

    - name: Enable httpd on day-2 KVM host
      ansible.builtin.systemd:
        name: httpd
        enabled: true

    - name: Restart httpd on day-2 KVM host
      ansible.builtin.service:
        name: httpd
        state: restarted

    - name: Start and enable firewalld
      tags: firewall-libvirt, libvirt
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Add ports to firewall on day-2 KVM host
      tags: firewall-libvirt, libvirt
      ansible.posix.firewalld:
        port: 80/tcp
        permanent: true
        state: enabled

    - name: Start and enable libvirt on day-2 KVM host
      tags: firewall-libvirt, libvirt
      ansible.builtin.service:
        name: libvirtd
        enabled: true
        state: started

    - name: Permit traffic in libvirt zone on day-2 KVM host
      tags: firewall-libvirt, libvirt
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        zone: libvirt
        immediate: true

    - name: Set libvirt management to libvirt group instead of root on day-2 KVM host
      tags: libvirt
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '#group = "root"'
        line: 'group = "libvirt"'
        backup: true

    - name: Get user home directory on day-2 KVM host
      tags: libvirt
      ansible.builtin.shell: >
        getent passwd {{ ansible_user }} | awk -F: '{ print $6 }'
      changed_when: false
      register: day2_user_home

    - name: Check if libvirt config directory exists on day-2 KVM host
      tags: libvirt
      ansible.builtin.stat:
        path: "{{ day2_user_home.stdout }}/.config/libvirt"
      register: day2_home_config_libvirt

    - name: Create libvirt config directory on day-2 KVM host
      tags: libvirt
      ansible.builtin.file:
        path: "{{ day2_user_home.stdout }}/.config/libvirt"
        state: directory
      when: not day2_home_config_libvirt.stat.exists

    - name: Create libvirt config file on day-2 KVM host
      tags: libvirt
      ansible.builtin.file:
        path: "{{ day2_user_home.stdout }}/.config/libvirt/libvirt.conf"
        state: touch
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Set default uri connection to qemu:///system on day-2 KVM host
      tags: libvirt
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '#uri_default = "qemu:///system"'
        line: 'uri_default = "qemu:///system"'
        backup: true
      loop:
        - /etc/libvirt/qemu.conf
        - /etc/libvirt/libvirt.conf

    - name: Ensure KVM admin user is part of groups 'kvm', 'libvirt' on day-2 KVM host
      tags: groups, group, libvirt
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        append: true
        groups: kvm,libvirt

    - name: Restart libvirt on day-2 KVM host
      tags: firewall-libvirt, libvirt
      ansible.builtin.service:
        name: libvirtd
        enabled: true
        state: restarted

    - name: Configure storage on day-2 KVM host
      ansible.builtin.import_role:
        name: configure_storage

    - name: Configure macvtap on day-2 KVM host
      ansible.builtin.import_role:
        name: macvtap
      when: env.network_mode | lower == 'macvtap'

    - name: Enable cockpit console on day-2 KVM host
      tags: cockpit
      ansible.builtin.command: systemctl enable --now cockpit.socket

    - name: Set default uri connection in user libvirt config on day-2 KVM host
      tags: libvirt
      ansible.builtin.lineinfile:
        path: "{{ day2_user_home.stdout }}/.config/libvirt/libvirt.conf"
        regexp: '#uri_default = "qemu:///system"'
        line: 'uri_default = "qemu:///system"'
        backup: true

    - name: Ensure KVM admin user is part of groups kvm and libvirt on day-2 KVM host
      tags: groups, group, libvirt
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        append: true
        groups: kvm,libvirt

    - name: Restart libvirt on day-2 KVM host
      tags: firewall-libvirt, libvirt
      ansible.builtin.service:
        name: libvirtd
        enabled: true
        state: restarted

    - name: Enable cockpit console on day-2 KVM host
      tags: cockpit
      ansible.builtin.command: systemctl enable --now cockpit.socket

    - name: Configure ip_forward in case of network NAT on day-2 KVM host
      tags: cfg_ip_forward
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "{{ env.z.ip_forward }}"
        sysctl_set: true
        state: present
        reload: true
      when: env.network_mode | upper == 'NAT'

- name: "Configure storage and network for macvtap"
  hosts: kvm_host
  tags: setup, section_3
  become: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  roles:
    - role: macvtap
      when: installation_type | lower in ['kvm'] and env.network_mode | lower == 'macvtap'
    - configure_storage

- name: Configure storage and network for macvtap on day-2 KVM host(s)
  hosts: day2_hosts
  tags: setup, section_3, day2_kvm_host
  become: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
  roles:
    - configure_storage
    - { role: macvtap, when: env.network_mode | lower == 'macvtap' }
