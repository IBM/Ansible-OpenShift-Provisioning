---
# playbooks/operators/install_ocp_virt.yaml
#
# Installs OpenShift Virtualization (OCP Virt) on a running OCP 4.19+ cluster.
# Requires: cluster verified (7_ocp_verification.yaml completed).
# Runs on:  bastion (oc + kubeconfig available).
#
# Before running:
#   cp inventories/default/group_vars/operators.yaml.template \
#      inventories/default/group_vars/operators.yaml
#   # Edit operators.yaml and configure the ocp_virt: variables.
#
# After the HyperConverged CR is Available, the virtctl CLI is downloaded from the
# cluster (ConsoleCLIDownload) and installed on the bastion
# (ocp_virt.virtctl.install, default true).
#
# Usage:
#   ansible-playbook playbooks/operators/install_ocp_virt.yaml --ask-vault-pass

- name: Install OpenShift Virtualization
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
    - "{{ inventory_dir }}/group_vars/secrets.yaml"
    - "{{ inventory_dir }}/group_vars/operators.yaml"
  pre_tasks:
    - name: Get the home directory of the bastion user
      ansible.builtin.command: printenv HOME
      changed_when: false
      register: _bastion_home

    - name: Set ocp_virt_kubeconfig to absolute path
      ansible.builtin.set_fact:
        ocp_virt_kubeconfig: "{{ ocp_virt_kubeconfig | regex_replace('^~', _bastion_home.stdout | trim) }}"

    - name: Read bastion SSH public key (used when test_vm.ssh_public_key is empty)
      ansible.builtin.shell: |
        for f in ~/.ssh/id_ed25519.pub ~/.ssh/id_ecdsa.pub ~/.ssh/id_rsa.pub; do
          [ -f "$f" ] && cat "$f" && break
        done
      changed_when: false
      register: _bastion_pubkey
      when: >-
        ocp_virt.test_vm.create | bool and
        ocp_virt.test_vm.ssh_public_key | default('') | length == 0

    - name: Inject bastion SSH public key into test_vm config
      ansible.builtin.set_fact:
        ocp_virt: >-
          {{ ocp_virt | combine({'test_vm': ocp_virt.test_vm |
             combine({'ssh_public_key': _bastion_pubkey.stdout | trim})},
             recursive=true) }}
      when: >-
        ocp_virt.test_vm.create | bool and
        ocp_virt.test_vm.ssh_public_key | default('') | length == 0 and
        _bastion_pubkey.stdout | default('') | trim | length > 0
  environment:
    KUBECONFIG: "{{ ocp_virt_kubeconfig }}"
  roles:
    - role: install_nfd_operator
      when: nfd_install | default(true) | bool
    - role: install_cert_manager_operator
      when: cert_manager_install | default(true) | bool
    - role: install_ocp_virt_operator
